<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Zeitung – Vorschau</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zeitung">
<meta name="theme-color" content="#f2f4f7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte wie eine Zeitungsseite, Kopf mit Titel, darunter Ausgabenwechsel Tag/Woche. Tag = rot, Woche = blau. */
:root {
  --paper: #f2f4f7;
  --ink: #12161d;
  --muted: #566170;
  --rule: #12161d;
  --hair: #cdd3dc;
  --box: #e7ebf1;
  --accent: #c4122f;
  --font-display: "Old Standard TT", "Times New Roman", serif;
  --font-body: "Source Serif 4", Georgia, serif;
  --font-label: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  color-scheme: light;
}
body[data-ed="woche"] { --accent: #1550b8; }
/* Immer hell. */
details.item { padding: 0; }
details.item > summary { list-style: none; cursor: pointer; padding: 12px 26px 12px 0; position: relative; }
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary::after { content: "+"; position: absolute; right: 2px; top: 10px; font-family: var(--font-label); font-size: 22px; color: var(--accent); }
details.item[open] > summary::after { content: "–"; }
details.item .body { padding: 0 0 14px; }
details.item .body p { margin: 0; }
.sum { margin: 2px 0 0; color: var(--ink); }
.reg { display: inline-block; font-family: var(--font-label); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--muted); border-radius: 3px; padding: 1px 6px; margin-right: 6px; vertical-align: 2px; }
.ticker li { padding: 7px 0; border-bottom: 1px solid var(--hair); list-style: none; }
.ticker ul { margin: 6px 0 0; padding: 0; }
.ticker .src { display: inline; margin-left: 6px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.tile { background: var(--box); border-top: 3px solid var(--accent); padding: 8px 8px 7px; }
.tn { font-family: var(--font-label); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tv { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tc { font-family: var(--font-label); font-weight: 600; font-size: 15px; color: #11743b; }
.tc.neg { color: var(--accent); }
.tnote { font-size: 12px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.pv { background: #fff4c2; border: 1px solid #e0c34a; padding: 8px 10px; margin-top: 12px; font-family: var(--font-label); font-size: 13px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding: 0 max(4px, env(safe-area-inset-right)) 48px max(4px, env(safe-area-inset-left));
}
.sheet { max-width: 900px; margin: 0 auto; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.mast { text-align: center; padding: 22px 0 10px; border-bottom: 4px double var(--rule); }
.mast h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 9vw, 52px); line-height: 1.05; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.mast .sub { font-family: var(--font-label); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

.tabs { display: flex; gap: 0; margin: 14px 0 0; border: 2px solid var(--rule); }
.tabs a {
  flex: 1; text-align: center; padding: 11px 8px; text-decoration: none; color: var(--ink);
  font-family: var(--font-label); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
}
.tabs a + a { border-left: 2px solid var(--rule); }
.tabs a[aria-current="page"] { background: var(--accent); color: #fff; }

.dateline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-family: var(--font-label); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dateline strong { color: var(--ink); font-weight: 600; }

.lead { background: var(--box); border-top: 4px solid var(--accent); margin: 14px 0 6px; padding: 10px 8px 2px; }
.lead h2 { font-family: var(--font-label); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; color: var(--accent); font-weight: 600; }
.lead ol { margin: 0; padding: 0; list-style: none; counter-reset: n; }
.lead li { counter-increment: n; padding: 6px 0 8px 30px; position: relative; border-top: 1px solid var(--hair); }
.lead li:first-child { border-top: 0; }
.lead li::before { content: counter(n); position: absolute; left: 0; top: 7px; font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1; color: var(--accent); width: 24px; text-align: center; }
.lead b { font-weight: 700; }

section.sec { margin-top: 26px; }
.sec > h2 { font-family: var(--font-display); font-size: 28px; line-height: 1.1; margin: 0 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--rule); text-wrap: balance; }
.item { padding: 14px 0; border-bottom: 1px solid var(--hair); }
.item h3 { font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; text-wrap: balance; }
.item p { margin: 0; }
.src { margin-top: 8px; font-family: var(--font-label); font-size: 13px; letter-spacing: .03em; color: var(--muted); }
.src a { margin-right: 10px; white-space: nowrap; }

.tablewrap { overflow-x: auto; margin-top: 10px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
table { border-collapse: collapse; width: 100%; min-width: 440px; font-size: 15px; }
th, td { text-align: left; padding: 9px 10px 9px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
th { font-family: var(--font-label); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.note { color: var(--muted); font-size: 14px; }

.next li { padding: 6px 0; }
.next b { font-family: var(--font-label); letter-spacing: .04em; }
ul.plain { margin: 10px 0 0; padding-left: 20px; }
ul.plain li { padding: 3px 0; }
.assess { margin-top: 10px; padding: 10px 10px; border-left: 5px solid var(--accent); background: var(--box); }

.empty { margin: 36px 0; padding: 22px 18px; border: 2px dashed var(--hair); text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 22px; margin-bottom: 6px; }
.foot { margin-top: 30px; padding-top: 12px; border-top: 4px double var(--rule); font-family: var(--font-label); font-size: 12px; letter-spacing: .06em; color: var(--muted); text-align: center; }
@media (min-width: 640px) { body { font-size: 18px; } .item h3 { font-size: 21px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body data-ed="tag">
<div class="sheet">
  <header class="mast">
    <h1>Die Zeitung</h1>
    <div class="sub">Wirtschaft und Politik für Samuel</div>
  </header>
  <nav class="tabs" aria-label="Ausgabe">
    <a href="#tag" id="tab-tag">Tagesausgabe</a>
    <a href="#woche" id="tab-woche">Wochenausgabe</a>
  </nav>
  <div class="pv">Vorschau des neuen Aufbaus. Die echte Zeitung ist unverändert.</div>
  <main id="root" aria-live="polite"></main>
  <footer class="foot">Tagesausgabe Montag bis Samstag früh, Wochenausgabe sonntags früh. Nur Meldungen mit Quelle, Lücken sind markiert.</footer>
</div>
<script>
(function () {
  var root = document.getElementById("root");
  var store = { tag: undefined, woche: undefined };
  var EMPTY = {
    tag: "Die nächste Tagesausgabe erscheint morgen früh gegen 6:45 Uhr (Montag bis Samstag).",
    woche: "Die erste Wochenausgabe erscheint am Sonntag, 15. November, gegen 7:15 Uhr."
  };
  var NAMES = { tag: "Tagesausgabe", woche: "Wochenausgabe" };

  function current() {
    var h = (location.hash || "").replace("#", "");
    if (h === "tag" || h === "woche") return h;
    return new Date().getDay() === 0 ? "woche" : "tag";
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  }
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }
  function arr(x) { return Array.isArray(x) ? x : []; }

  function sources(list) {
    var box = el("div", "src");
    var n = 0;
    arr(list).forEach(function (s) {
      var u = safeUrl(s && s.url);
      if (!u) return;
      var a = el("a", null, s.name || "Quelle");
      a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
      box.appendChild(a); n++;
    });
    return n ? box : null;
  }

  function build(key, d) {
    var frag = document.createDocumentFragment();
    var dl = el("div", "dateline");
    var l = el("span"); var s1 = el("strong", null, d.dateLabel || NAMES[key]); l.appendChild(s1);
    dl.appendChild(l);
    if (d.updatedAt) {
      var t = new Date(d.updatedAt);
      if (!isNaN(t)) {
        dl.appendChild(el("span", null, "Stand " + t.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + " Uhr"));
      }
    }
    frag.appendChild(dl);

    if (arr(d.top).length) {
      var lead = el("div", "lead");
      lead.appendChild(el("h2", null, key === "woche" ? "Die Woche in Kürze" : "Die 5 wichtigsten Nachrichten"));
      var ol = el("ol");
      d.top.forEach(function (p) {
        var li = el("li");
        if (p.head) { li.appendChild(el("b", null, p.head)); li.appendChild(document.createTextNode(" ")); }
        li.appendChild(document.createTextNode(p.text || ""));
        ol.appendChild(li);
      });
      lead.appendChild(ol); frag.appendChild(lead);
    }

    var m = d.markets;
    if (m && arr(m.rows).length) {
      var ms = el("section", "sec");
      ms.appendChild(el("h2", null, "Märkte"));
      var tiles = el("div", "tiles");
      m.rows.slice(0, 3).forEach(function (r) {
        var t = el("div", "tile");
        t.appendChild(el("div", "tn", r.name));
        t.appendChild(el("div", "tv", r.value));
        var ch = el("div", "tc", r.change); if (/^[−-]/.test(r.change || "")) ch.className += " neg"; t.appendChild(ch);
        t.appendChild(el("div", "tnote", r.note || ""));
        tiles.appendChild(t);
      });
      ms.appendChild(tiles);
      var wrap = el("div", "tablewrap");
      var tb = el("table");
      var thead = el("tr");
      ["Markt", "Stand", "Veränderung", "Stichtag, Quelle"].forEach(function (h) { thead.appendChild(el("th", null, h)); });
      tb.appendChild(thead);
      m.rows.slice(3).forEach(function (r) {
        var tr = el("tr");
        tr.appendChild(el("td", null, r.name));
        tr.appendChild(el("td", "num", r.value));
        tr.appendChild(el("td", "num", r.change));
        var tdn = el("td", "note");
        tdn.appendChild(document.createTextNode(r.note || ""));
        var u = safeUrl(r.url);
        if (u) { tdn.appendChild(document.createTextNode(" ")); var a = el("a", null, r.srcName || "Quelle"); a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; tdn.appendChild(a); }
        tr.appendChild(tdn); tb.appendChild(tr);
      });
      wrap.appendChild(tb); ms.appendChild(wrap);
      if (m.comment) ms.appendChild(el("p", "note", m.comment));
      frag.appendChild(ms);
    }

    arr(d.sections).forEach(function (sec) {
      var s = el("section", "sec");
      s.appendChild(el("h2", null, sec.name || ""));
      arr(sec.items).forEach(function (it) {
        var art = el("article", "item");
        var h = el("h3");
        var lab = [it.region, it.topic].filter(Boolean).join(" · ");
        if (lab) h.appendChild(el("span", "reg", lab));
        h.appendChild(document.createTextNode(it.head || ""));
        art.appendChild(h);
        art.appendChild(el("p", null, it.text || ""));
        var sr = sources(it.sources); if (sr) art.appendChild(sr);
        s.appendChild(art);
      });
      frag.appendChild(s);
    });

    if (arr(d.ticker).length) {
      var ts = el("section", "sec ticker");
      ts.appendChild(el("h2", null, "Kurz notiert"));
      var tul = el("ul");
      d.ticker.forEach(function (t) {
        var li = el("li");
        if (t.region) li.appendChild(el("span", "reg", t.region));
        li.appendChild(document.createTextNode(t.text || ""));
        var sr = sources(t.sources); if (sr) li.appendChild(sr);
        tul.appendChild(li);
      });
      ts.appendChild(tul); frag.appendChild(ts);
    }

    if (arr(d.next).length) {
      var ns = el("section", "sec next");
      ns.appendChild(el("h2", null, "Nächste Woche"));
      var ul = el("ul", "plain");
      d.next.forEach(function (n) {
        var li = el("li"); li.appendChild(el("b", null, (n.date || "") + " ")); li.appendChild(document.createTextNode(n.text || "")); ul.appendChild(li);
      });
      ns.appendChild(ul); frag.appendChild(ns);
    }

    if (d.assessment) {
      var as = el("section", "sec");
      as.appendChild(el("h2", null, "Einordnung"));
      as.appendChild(el("p", "assess", d.assessment));
      frag.appendChild(as);
    }

    if (arr(d.notes).length) {
      var gs = el("section", "sec");
      gs.appendChild(el("h2", null, "Lücken und Hinweise"));
      var gl = el("ul", "plain");
      d.notes.forEach(function (n) { gl.appendChild(el("li", null, n)); });
      gs.appendChild(gl); frag.appendChild(gs);
    }
    return frag;
  }

  function render() {
    var key = current();
    document.body.setAttribute("data-ed", key);
    ["tag", "woche"].forEach(function (k) {
      var a = document.getElementById("tab-" + k);
      if (k === key) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    var d = store[key];
    root.replaceChildren();
    if (d === undefined) {
      var w = el("div", "empty"); w.appendChild(el("strong", null, "Lädt …")); w.appendChild(document.createTextNode("Die Ausgabe wird geholt.")); root.appendChild(w); return;
    }
    if (d === null) {
      var e = el("div", "empty"); e.appendChild(el("strong", null, "Noch keine " + NAMES[key])); e.appendChild(document.createTextNode(EMPTY[key])); root.appendChild(e); return;
    }
    root.appendChild(build(key, d));
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", render);
  render();

  function loadEdition(k) {
    return fetch((k === "tag" ? "vorschau-tag" : k) + ".json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { store[k] = d; })
      .catch(function () { store[k] = null; })
      .then(render);
  }
  loadEdition("tag");
  loadEdition("woche");
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { loadEdition("tag"); loadEdition("woche"); }
  });
})();
</script>
</body>
</html>
