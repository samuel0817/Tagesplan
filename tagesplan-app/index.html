/* Layout idea: eine Spalte, Tagesreiter oben, Zeitleiste mit farbigen Kategorien. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#13171d; --muted:#5b6471; --line:#dfe3e9;
  --schule:#2f6fe4; --sport:#e0530a; --arbeit:#8a3fd0; --lernen:#c99200; --selbst:#0f9d6e; --alltag:#6a7585; --klausur:#d4244a; --fahr:#0e8fa3;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1015; --surface:#161a21; --ink:#eef1f6; --muted:#9ba5b3; --line:#262c36;
    --schule:#5f9dff; --sport:#ff8c4d; --arbeit:#b98aff; --lernen:#f3c437; --selbst:#41d3a3; --alltag:#8d98a8; --klausur:#ff6283; --fahr:#3cc6d9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1015; --surface:#161a21; --ink:#eef1f6; --muted:#9ba5b3; --line:#262c36;
  --schule:#5f9dff; --sport:#ff8c4d; --arbeit:#b98aff; --lernen:#f3c437; --selbst:#41d3a3; --alltag:#8d98a8; --klausur:#ff6283; --fahr:#3cc6d9;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.weeknav{display:flex;gap:6px}
.weeknav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.exams{display:flex;gap:8px;flex-wrap:wrap}
.exam{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--klausur);border-radius:10px;padding:6px 10px;font-size:13px;display:flex;gap:8px;align-items:baseline}
.exam.lern{border-left-color:var(--lernen)}
.exam b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:7px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--body)}
.tab .w{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tab .d{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .w{color:var(--bg);opacity:.75}
.tab.today:not([aria-selected="true"]){border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px 5px 8px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--body)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--cat)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--cat) 18%,var(--surface));border-color:var(--cat)}
.progress{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--selbst);width:0;transition:width .25s}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:54px 1fr 34px;gap:10px;align-items:center;background:color-mix(in srgb,var(--cat) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--cat) 28%,var(--line));border-left:6px solid var(--cat);border-radius:12px;padding:10px 10px 10px 12px}
.row.past{opacity:.55}
.row.now{box-shadow:0 0 0 2px var(--cat)}
.time{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.05;font-variant-numeric:tabular-nums}
.time small{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.t{font-weight:600;font-size:16px}
.n{color:var(--muted);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--cat);margin-bottom:2px}
.now-tag{background:var(--cat);color:var(--bg);border-radius:4px;padding:1px 5px;margin-left:6px}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--cat);background:transparent;color:var(--bg);cursor:pointer;font-size:17px;line-height:1;padding:0}
.check[aria-pressed="true"]{background:var(--cat)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.banner{background:var(--klausur);color:#fff;border-radius:12px;padding:12px 14px;font-family:var(--display);font-size:24px;font-weight:700}
.banner small{display:block;font-family:var(--body);font-size:13px;font-weight:500;opacity:.9}
.empty{color:var(--muted);padding:14px 0}
.notice{background:var(--lernen);color:#13171d;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>

      tabs.appendChild(b);
    }
  }

  function renderChips(){
    var box=document.getElementById("chips"); box.innerHTML="";
    Object.keys(CATS).forEach(function(k){
      if(k==="klausur")return;
      var b=el("button","chip"); b.style.setProperty("--cat","var(--"+k+")");
      b.setAttribute("aria-pressed",filter===k?"true":"false");
      b.appendChild(el("i"));
      b.appendChild(document.createTextNode(CATS[k].n));
      b.addEventListener("click",function(){filter=(filter===k?null:k);render();});
      box.appendChild(b);
    });
  }

  function render(){
    var mon=monday(weekOffset);
    var date=new Date(mon); date.setDate(mon.getDate()+sel);
    var key=iso(date), isToday=(key===iso(today));
    document.getElementById("title").textContent = isToday?"Heute":WDL[date.getDay()];
    document.getElementById("sub").textContent = WDL[date.getDay()]+", "+date.getDate()+". "+MON[date.getMonth()]+" "+date.getFullYear();
    renderStudy(key); renderTabs();

    var blocks=(DAY[date.getDay()]||[]).slice();
    var ov=OV[key];
    if(ov){
      if(ov.dropCat){blocks=blocks.filter(function(b){return ov.dropCat.indexOf(b[3])<0;});}
      if(ov.drop){blocks=blocks.filter(function(b){return ov.drop.indexOf(b[2])<0;});}
      if(ov.add){blocks=blocks.concat(ov.add);}
    }
    blocks.sort(function(a,b){return mins(a[0])-mins(b[0])||mins(a[1])-mins(b[1]);});

    var nb=document.getElementById("notice"); nb.innerHTML="";
    var endD=new Date(PLAN_END+"T00:00:00"); var left=Math.round((endD-today)/86400000);
    if(left<0){nb.appendChild(el("div","notice","Der Lernplan ist abgelaufen. Schick Claude neue Klausuren, Spielplan und Trainingszeiten."));}
    else if(left<=14){nb.appendChild(el("div","notice","Der Lernplan läuft in "+left+" Tagen aus. Schick Claude bald neue Klausuren, Spielplan und Trainingszeiten."));}
    var ban=document.getElementById("banners"); ban.innerHTML="";
    EX.forEach(function(x){
      if(x[0]===key){
        var b=el("div","banner","KLAUSUR "+x[1]);
        b.appendChild(el("small",null,"Heute nur das Nötigste. Früh ins Bett."));
        ban.appendChild(b);
      }
    });

    var list=document.getElementById("list"); list.innerHTML="";
    var now=new Date(); var nm=now.getHours()*60+now.getMinutes();
    var shown=0, total=0, done=0;
    blocks.forEach(function(b,idx){
      var cat=b[3];
      var k="done:"+key+":"+idx+":"+b[2];
      var isDone=load(k);
      total++; if(isDone)done++;
      if(filter && filter!==cat)return;
      shown++;
      var s=mins(b[0]), e=mins(b[1]);
      var row=el("li","row"+(isDone?" done":"")+((isToday&&nm>=e)?" past":"")+((isToday&&nm>=s&&nm<e)?" now":""));
      row.style.setProperty("--cat","var(--"+cat+")");
      var tm=el("div","time",b[0]); tm.appendChild(el("small",null,b[1]));
      var mid=el("div");
      if(isToday&&nm>=s&&nm<e){var tag=el("div","tag");tag.appendChild(el("span","now-tag","jetzt"));mid.appendChild(tag);}
      mid.appendChild(el("div","t",b[2]));
      if(b[4]){mid.appendChild(el("div","n",b[4]));}
      var chk=el("button","check",isDone?"✓":"");
      chk.setAttribute("aria-pressed",isDone?"true":"false");
      chk.setAttribute("aria-label","Erledigt: "+b[2]);
      chk.addEventListener("click",function(){save(k,!isDone);render();});
      row.appendChild(tm); row.appendChild(mid); row.appendChild(chk);
      list.appendChild(row);
    });
    if(!shown){list.appendChild(el("li","empty","Nichts in dieser Kategorie an diesem Tag."));}
    document.getElementById("ptext").textContent=done+" von "+total+" erledigt";
    document.getElementById("pbar").style.width=(total?Math.round(done/total*100):0)+"%";
  }

  document.addEventListener("visibilitychange",function(){if(!document.hidden&&iso(atMidnight(new Date()))!==iso(today)){location.reload();}});
  document.getElementById("prev").addEventListener("click",function(){weekOffset--;render();});
  document.getElementById("next").addEventListener("click",function(){weekOffset++;render();});
  render();
})();
</script>
</body>
</html>
